<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rule Intake · Doctor Knowledge Acquisition</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ink:#16232e;
    --ink-soft:#41525c;
    --paper:#eef2f1;
    --surface:#ffffff;
    --surface-2:#f5f7f6;
    --line:#d7dedb;
    --line-soft:#e6ebe9;
    --muted:#5b6b68;
    --accent:#2f7d6b;
    --accent-ink:#eaf5f1;
    --accent-strong:#1f5c4e;
    --warn:#b5502e;
    --warn-bg:#fbeee7;
    --warn-line:#e8c4ae;
    --shadow: 0 1px 2px rgba(22,35,46,.06), 0 10px 28px rgba(22,35,46,.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#e8edea; --ink-soft:#b7c4c0; --paper:#101617; --surface:#161e20;
      --surface-2:#1b2426; --line:#293335; --line-soft:#222b2d; --muted:#93a29e;
      --accent:#4fae95; --accent-ink:#0f2621; --accent-strong:#7bc9b3;
      --warn:#e08a5f; --warn-bg:#2a1c15; --warn-line:#4a3223;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --ink:#e8edea; --ink-soft:#b7c4c0; --paper:#101617; --surface:#161e20;
    --surface-2:#1b2426; --line:#293335; --line-soft:#222b2d; --muted:#93a29e;
    --accent:#4fae95; --accent-ink:#0f2621; --accent-strong:#7bc9b3;
    --warn:#e08a5f; --warn-bg:#2a1c15; --warn-line:#4a3223;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.4);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--paper); }
  body {
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--ink);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-size: 15px;
  }
  h1, h2 { font-family: 'Source Serif 4', Georgia, serif; }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }

  .app {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .mark {
    width: 38px; height: 38px; border-radius: 10px;
    background: var(--accent-ink); color: var(--accent-strong);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Source Serif 4'; font-weight: 600; font-size: 17px;
    flex-shrink: 0;
  }
  header .title h1 { font-size: 17px; font-weight: 600; }
  header .title p  { font-size: 12px; color: var(--muted); margin-top: 2px; }
  header .spacer { flex: 1; }
  .restart {
    display: flex; align-items: center; gap: 6px;
    font-family: 'IBM Plex Sans'; font-size: 12.5px; font-weight: 500;
    color: var(--muted); background: transparent; border: 1px solid var(--line);
    padding: 7px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  }
  .restart:hover { border-color: var(--accent); color: var(--accent-strong); }

  .trust {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 10px 20px; font-size: 11.5px; color: var(--muted);
    border-bottom: 1px solid var(--line-soft); background: var(--surface-2);
    flex-shrink: 0;
  }
  .trust .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
  }
  .trust .chip .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 20px 8px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }

  .row { display: flex; align-items: flex-end; gap: 10px; }
  .row.doctor-bot { justify-content: flex-start; }
  .row.doctor-you { justify-content: flex-end; }

  .icon {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    background: var(--accent-ink); color: var(--accent-strong);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
  }
  .row.doctor-you .icon { display: none; }

  .bubble {
    max-width: min(82%, 520px);
    padding: 11px 15px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.55;
    word-break: break-word;
    white-space: pre-line;
  }
  .row.doctor-bot .bubble {
    background: var(--surface-2);
    color: var(--ink);
    border: 1px solid var(--line-soft);
    border-radius: 4px 16px 16px 16px;
  }
  .row.doctor-you .bubble {
    background: var(--accent);
    color: var(--accent-ink);
    border-radius: 16px 16px 4px 16px;
  }

  .typing-dots {
    display: flex; gap: 5px;
    padding: 13px 16px;
    background: var(--surface-2);
    border: 1px solid var(--line-soft);
    border-radius: 4px 16px 16px 16px;
    width: fit-content;
  }
  .typing-dots span {
    width: 6px; height: 6px;
    background: var(--muted); border-radius: 50%;
    animation: bop 1.3s ease-in-out infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.16s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.32s; }
  @keyframes bop {
    0%, 60%, 100% { transform: translateY(0); }
    30%           { transform: translateY(-5px); }
  }

  /* ---- Draft card ---- */
  .draft-card {
    margin-top: 4px;
    background: var(--surface);
    border: 1.5px solid var(--accent);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
    width: 100%;
  }
  .draft-head {
    display: flex; align-items: center; gap: 10px; padding: 12px 18px;
    background: var(--accent-ink); border-bottom: 1px solid var(--line-soft);
  }
  .draft-head .label { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent-strong); }
  .draft-head h2 { font-size: 18px; font-weight: 600; color: var(--accent-strong); }
  .draft-body { padding: 14px 18px; }
  .draft-row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line-soft); font-size: 13px; }
  .draft-row:last-of-type { border-bottom: none; }
  .draft-row .k { color: var(--muted); }
  .draft-row .v { font-family: 'IBM Plex Mono'; font-size: 12.5px; text-align: right; }

  .symptom-item {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid var(--line-soft); font-size: 13px;
  }
  .symptom-item:last-child { border-bottom: none; }
  .symptom-item .q { flex: 1; }
  .symptom-item .fact { font-family: 'IBM Plex Mono'; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .symptom-item .tags { display: flex; gap: 6px; flex-shrink: 0; }
  .sevtag {
    font-family: 'IBM Plex Mono'; font-size: 10px; font-weight: 600;
    padding: 2px 7px; border-radius: 999px; color: var(--ink);
    background: color-mix(in srgb, var(--warn) calc(var(--sev-pct, 60%)), transparent);
  }
  .sev-1, .sev-2 { --sev-pct: 25%; }
  .sev-3 { --sev-pct: 45%; }
  .sev-4 { --sev-pct: 65%; }
  .sev-5 { --sev-pct: 85%; }
  .primarytag {
    font-family: 'IBM Plex Sans'; font-size: 10px; font-weight: 600;
    padding: 2px 8px; border-radius: 999px; color: var(--accent-strong);
    background: var(--accent-ink); border: 1px solid var(--accent);
  }

  .draft-actions { display: flex; gap: 10px; padding: 4px 18px 16px; }
  .btn-confirm, .btn-discard {
    flex: 1; padding: 10px 16px; border-radius: 10px; font-size: 13.5px; font-weight: 600;
    cursor: pointer; font-family: inherit; border: none;
  }
  .btn-confirm { background: var(--accent); color: var(--accent-ink); }
  .btn-confirm:hover { background: var(--accent-strong); }
  .btn-confirm:disabled { background: var(--line); color: var(--muted); cursor: default; }
  .btn-discard { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
  .btn-discard:hover { border-color: var(--warn); color: var(--warn); }

  .note {
    margin: 0 18px 16px; padding: 9px 12px; border-radius: 9px;
    background: var(--surface-2); border: 1px dashed var(--line); color: var(--muted);
    font-size: 11.5px; line-height: 1.5;
  }

  #new-chat-bar {
    display: none; justify-content: center; padding: 14px 16px;
    background: var(--surface); border-top: 1px solid var(--line); flex-shrink: 0;
  }
  #new-chat-btn {
    background: var(--accent); color: var(--accent-ink); border: none;
    border-radius: 999px; padding: 11px 28px; font-size: 14.5px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; gap: 8px;
    font-family: inherit;
  }
  #new-chat-btn:hover { background: var(--accent-strong); }

  #bar {
    background: var(--surface);
    border-top: 1px solid var(--line);
    padding: 14px 20px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-shrink: 0;
  }
  #txt {
    flex: 1;
    border: 1.5px solid var(--line);
    border-radius: 22px;
    padding: 10px 16px;
    font-size: 14.5px;
    outline: none;
    transition: border-color 0.18s, background 0.18s;
    resize: none;
    line-height: 1.4;
    max-height: 90px;
    font-family: inherit;
    background: var(--surface-2);
    color: var(--ink);
  }
  #txt:focus { border-color: var(--accent); background: var(--surface); }
  #txt:disabled { background: var(--surface-2); opacity: .6; }
  #btn {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink); border: none;
    cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.18s, transform 0.1s;
    flex-shrink: 0;
  }
  #btn:hover:not(:disabled) { background: var(--accent-strong); transform: scale(1.05); }
  #btn:disabled { background: var(--line); color: var(--muted); cursor: default; }

  .disclaimer {
    text-align: center;
    font-size: 10.5px;
    color: var(--muted);
    padding: 0 20px 14px;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="mark">⚕</div>
    <div class="title">
      <h1>Rule Intake</h1>
      <p>Doctor knowledge-acquisition interface</p>
    </div>
    <div class="spacer"></div>
    <button id="restart-btn" class="restart" title="Start a new intake">↺ Restart</button>
  </header>

  <div class="trust">
    <span class="chip"><span class="dot"></span>Nothing added without confirmation</span>
    <span class="chip"><span class="dot"></span>Goes live immediately once confirmed</span>
    <span class="chip"><span class="dot"></span>Every draft is reviewable</span>
  </div>

  <div id="chat"></div>

  <div id="new-chat-bar">
    <button id="new-chat-btn">&#43; Add Another Condition</button>
  </div>
  <div id="bar">
    <textarea id="txt" rows="1"
      placeholder="Type your answer…"
      disabled></textarea>
    <button id="btn" disabled title="Send">&#10148;</button>
  </div>
  <div class="disclaimer">Draft rules are never added to the live knowledge base until you confirm them below.</div>
</div>

<script>
const chatEl      = document.getElementById('chat');
const txtEl       = document.getElementById('txt');
const btnEl       = document.getElementById('btn');
const newChatBar  = document.getElementById('new-chat-bar');
const newChatBtn  = document.getElementById('new-chat-btn');
const restartBtn  = document.getElementById('restart-btn');

let session = null;

function restartChat() {
  chatEl.innerHTML = '';
  newChatBar.style.display = 'none';
  document.getElementById('bar').style.display = 'flex';
  startSession();
}

function addBubble(text, role) {
  const row = document.createElement('div');
  row.className = `row ${role}`;
  if (role === 'doctor-bot') {
    const icon = document.createElement('div');
    icon.className = 'icon';
    icon.textContent = '🤖';
    row.appendChild(icon);
  }
  const bub = document.createElement('div');
  bub.className = 'bubble';
  bub.textContent = text;
  row.appendChild(bub);
  chatEl.appendChild(row);
  chatEl.scrollTop = chatEl.scrollHeight;
  return row;
}

function addDraftCard(draft) {
  const row = document.createElement('div');
  row.className = 'row doctor-bot';

  const icon = document.createElement('div');
  icon.className = 'icon';
  icon.textContent = '🤖';
  row.appendChild(icon);

  const card = document.createElement('div');
  card.className = 'draft-card';

  const symptomsHtml = draft.symptoms.map(s => `
    <div class="symptom-item">
      <div class="q">
        ${s.text}
        <div class="fact">${s.fact}</div>
      </div>
      <div class="tags">
        ${s.primary ? '<span class="primarytag">hallmark</span>' : ''}
        <span class="sevtag sev-${s.severity}">${s.severity}/5</span>
      </div>
    </div>`).join('');

  card.innerHTML = `
    <div class="draft-head">
      <div>
        <div class="label">Draft &mdash; unconfirmed</div>
        <h2>${draft.name.replace(/_/g, ' ')}</h2>
      </div>
    </div>
    <div class="draft-body">
      <div class="draft-row"><span class="k">Category</span><span class="v">${draft.category}</span></div>
      <div class="draft-row"><span class="k">Confirmation threshold</span><span class="v">${draft.threshold} of ${draft.symptoms.filter(s=>!s.primary).length} non-hallmark facts</span></div>
      ${symptomsHtml}
    </div>
    <div class="note">A <b>hallmark</b> symptom confirms this condition on its own, without needing the threshold count. Everything else counts toward the plain threshold.</div>
    <div class="draft-actions">
      <button class="btn-confirm">Add to Knowledge Base</button>
      <button class="btn-discard">Discard draft</button>
    </div>`;

  card.querySelector('.btn-confirm').addEventListener('click', () => confirmDraft(draft, card));
  card.querySelector('.btn-discard').addEventListener('click', () => discardDraft(card));

  row.appendChild(card);
  chatEl.appendChild(row);
  chatEl.scrollTop = chatEl.scrollHeight;
}

async function confirmDraft(draft, card) {
  const btn = card.querySelector('.btn-confirm');
  btn.disabled = true;
  btn.textContent = 'Adding…';
  try {
    const res = await fetch('/doctor/confirm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ draft })
    });
    const data = await res.json();
    card.querySelectorAll('.draft-actions, .note').forEach(el => el.remove());
    if (data.ok) {
      addBubble(data.message, 'doctor-bot');
    } else {
      addBubble(`Could not add this: ${data.error}`, 'doctor-bot');
    }
    document.getElementById('bar').style.display = 'none';
    newChatBar.style.display = 'flex';
  } catch {
    btn.disabled = false;
    btn.textContent = 'Add to Knowledge Base';
    addBubble('Something went wrong saving this. Please try again.', 'doctor-bot');
  }
}

async function discardDraft(card) {
  await fetch('/doctor/discard', { method: 'POST' });
  card.querySelectorAll('.draft-actions, .note').forEach(el => el.remove());
  addBubble('Draft discarded — nothing was added.', 'doctor-bot');
  document.getElementById('bar').style.display = 'none';
  newChatBar.style.display = 'flex';
}

function showTyping() {
  const row = document.createElement('div');
  row.className = 'row doctor-bot';
  row.id = 'typing-row';
  const icon = document.createElement('div');
  icon.className = 'icon';
  icon.textContent = '🤖';
  const dots = document.createElement('div');
  dots.className = 'typing-dots';
  dots.innerHTML = '<span></span><span></span><span></span>';
  row.appendChild(icon);
  row.appendChild(dots);
  chatEl.appendChild(row);
  chatEl.scrollTop = chatEl.scrollHeight;
}
function hideTyping() {
  const el = document.getElementById('typing-row');
  if (el) el.remove();
}
function setEnabled(on) {
  txtEl.disabled = !on;
  btnEl.disabled = !on;
  if (on) txtEl.focus();
}

txtEl.addEventListener('input', () => {
  txtEl.style.height = 'auto';
  txtEl.style.height = Math.min(txtEl.scrollHeight, 90) + 'px';
});

async function send() {
  const text = txtEl.value.trim();
  if (!text || !session) return;

  txtEl.value = '';
  txtEl.style.height = 'auto';
  addBubble(text, 'doctor-you');
  setEnabled(false);
  showTyping();

  try {
    const res = await fetch('/doctor/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session })
    });
    const data = await res.json();
    hideTyping();
    session = data.session;
    addBubble(data.message, 'doctor-bot');

    if (data.draft) {
      addDraftCard(data.draft);
    } else {
      setEnabled(true);
    }
  } catch (err) {
    hideTyping();
    addBubble('Something went wrong. Please try again.', 'doctor-bot');
    setEnabled(true);
  }
}

btnEl.addEventListener('click', send);
txtEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

newChatBtn.addEventListener('click', restartChat);
restartBtn.addEventListener('click', restartChat);

async function startSession() {
  showTyping();
  try {
    const res = await fetch('/doctor/start', { method: 'POST' });
    const data = await res.json();
    hideTyping();
    session = data.session;
    addBubble(data.message, 'doctor-bot');
    setEnabled(true);
  } catch {
    hideTyping();
    addBubble('Could not connect to the server. Make sure app.py is running.', 'doctor-bot');
  }
}

startSession();
</script>
</body>
</html>
